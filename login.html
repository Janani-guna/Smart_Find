<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SmartFind</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon"><i class="fas fa-search-location"></i></span>
        <span>SmartFind</span>
      </a>
    </div>
  </header>

  <main class="main-wrapper" style="max-width: 440px;">
    <div class="card" style="margin-top: 2rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2>Classroom Portal Login</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Sign in to manage and report classroom items</p>
      </div>

      <div style="background: #eff6ff; border: 1px dashed #3b82f6; border-radius: var(--radius-sm); padding: 0.75rem; font-size: 0.8rem; margin-bottom: 1.25rem;">
        <strong>Demo Credentials:</strong><br>
        • Admin: <code>admin@college.edu</code> / <code>admin123</code><br>
        • Student: <code>arun@student.college.edu</code> / <code>student123</code>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">College Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@student.college.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem;">
        Don't have an account? <a href="register.html">Register Student Account</a>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const user = AuthService.login(email, password);
      if(user) {
        showToast(`Welcome back, ${user.name}!`);
        setTimeout(() => {
          if(user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 800);
      } else {
        showToast('Invalid credentials. Please verify demo info above.', 'danger');
      }
    });
  </script>
</body>
</html>
