<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search & Filter - SmartFind</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon"><i class="fas fa-search-location"></i></span>
        <span>SmartFind</span>
      </a>

      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="fas fa-bars"></i>
      </button>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html" class="active">Search Items</a></li>
        <li><a href="report-lost.html">Report Lost</a></li>
        <li><a href="report-found.html">Report Found</a></li>
        <li id="navDashboardLink" style="display:none;"><a href="dashboard.html">Dashboard</a></li>
      </ul>

      <div class="nav-actions">
        <div id="authNavContainer"></div>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div style="margin-bottom: 1.5rem;">
      <h1>Classroom Item Directory</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Browse lost and found items reported across classrooms.</p>
    </div>

    <!-- Search & Filter Controls -->
    <div class="card" style="margin-bottom: 1.5rem;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; align-items: end;">
        
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">Search Query</label>
          <input type="text" id="searchKeyword" class="form-control" placeholder="Name, brand, keyword...">
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">Report Type</label>
          <select id="filterType" class="form-control">
            <option value="all">All Types (Lost & Found)</option>
            <option value="lost">Lost Only</option>
            <option value="found">Found Only</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">Category</label>
          <select id="filterCategory" class="form-control">
            <option value="all">All Categories</option>
            <option value="ID Card">ID Card</option>
            <option value="Books">Books</option>
            <option value="Calculator">Calculator</option>
            <option value="Mobile Phone">Mobile Phone</option>
            <option value="Earphones">Earphones</option>
            <option value="Wallet">Wallet</option>
            <option value="Keys">Keys</option>
            <option value="Bag">Bag</option>
            <option value="Water Bottle">Water Bottle</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">Location</label>
          <input type="text" id="filterLocation" class="form-control" placeholder="e.g. Classroom 3">
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">Sort By</label>
          <select id="filterSort" class="form-control">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>

        <div>
          <button id="resetFilterBtn" class="btn btn-secondary btn-block"><i class="fas fa-redo"></i> Reset</button>
        </div>
      </div>
    </div>

    <!-- Results Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <span style="font-weight: 600; color: var(--text-muted);" id="resultCount">Showing 0 items</span>
    </div>

    <!-- Item Cards Grid -->
    <div class="item-grid" id="searchResultsGrid"></div>
  </main>

  <footer class="footer">
    <p>SmartFind Classroom Lost and Found &copy; 2026</p>
  </footer>

  <div id="toast-container"></div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
