<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - SmartFind</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon"><i class="fas fa-search-location"></i></span>
        <span>SmartFind</span>
      </a>
    </div>
  </header>

  <main class="main-wrapper" style="max-width: 500px;">
    <div class="card" style="margin-top: 1.5rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2>Create Student Account</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Register to track classroom lost and found items</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <input type="text" id="regName" class="form-control" placeholder="e.g. Arun Kumar" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">College Email</label>
          <input type="email" id="regEmail" class="form-control" placeholder="rollno@college.edu" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="regPhone">Contact Number</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="9876543210" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regDept">Department</label>
            <select id="regDept" class="form-control" required>
              <option value="">Select Dept</option>
              <option value="Computer Science">Computer Science</option>
              <option value="AI & Data Science">AI & Data Science</option>
              <option value="Information Tech">Information Tech</option>
              <option value="Mechanical Eng">Mechanical Eng</option>
              <option value="Electronics & Comm">Electronics & Comm</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Min. 6 characters" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Complete Registration</button>
      </form>

      <div style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem;">
        Already registered? <a href="login.html">Sign In Here</a>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const department = document.getElementById('regDept').value;
      const password = document.getElementById('regPassword').value;

      try {
        const newUser = AuthService.register({ name, email, phone, department, password, role: 'student' });
        showToast('Registration successful! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1000);
      } catch(err) {
        showToast(err.message, 'danger');
      }
    });
  </script>
</body>
</html>
